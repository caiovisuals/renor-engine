version: 2
updates:
  # The public engine repository root. The workflow's actions are pinned to
  # commit SHAs rather than mutable tags, so something must move them when a
  # patch ships; this is what does. The private monorepo's dependabot covers
  # its own npm roots and is not part of the exported cut.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      routine-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # The SDK's 1.32 line changes how a call with missing or wrong arguments
      # is answered, which tests/mvp/schema-rejected-calls.test.ts pins. Take a
      # major or minor jump only after that test is updated by someone who has
      # read the SDK change.
      - dependency-name: "@modelcontextprotocol/sdk"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
